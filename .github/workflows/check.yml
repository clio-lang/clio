name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run check
      - name: Network contract acceptance
        run: bun run test:network
        timeout-minutes: 2
      - name: Bundled network runtime acceptance
        run: bun run test:network --built
        timeout-minutes: 2
