name: Native release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: macos-15
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate release classifier
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Classify version tag
        id: version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 .github/scripts/release_version.py
      - name: Install native dependencies
        run: brew install cmake ninja llvm@22 tomlplusplus
      - name: Configure CPU toolchain
        run: >-
          cmake -S . -B build/native -G Ninja
          -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          -DKALANDRA_LLVM_ROOT="$(brew --prefix llvm@22)"
          -Dtomlplusplus_DIR="$(brew --prefix tomlplusplus)/lib/cmake/tomlplusplus"
          -DKALANDRA_BUILD_METAL_RUNTIME=OFF -DKALANDRA_BUILD_METAL_PROOF=OFF
      - name: Build release packages
        run: cmake --build build/native --target native-cpu-package native-editor-tools-package -j2
      - name: Qualify installed and relocated packages
        run: ctest --test-dir build/native -R '^native-(cpu|editor-tools)-install$' --output-on-failure
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.12'
      - name: Build and test editor package
        working-directory: native/editor/vscode
        run: |
          bun install --frozen-lockfile
          bun test
          bun run package
      - name: Assemble release assets
        run: |
          mkdir release-assets
          cp build/native/native-cpu/*.tar.gz* release-assets/
          cp build/native/native-editor-tools/*.tar.gz* release-assets/
          cp build/native/editor/kalandra-native.vsix release-assets/
          cd release-assets
          shasum -a 256 kalandra-native.vsix > kalandra-native.vsix.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: native-release-assets
          path: release-assets/*
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: native-release-assets
          path: release-assets
      - name: Create draft, upload assets, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          RELEASE_PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: python3 .github/scripts/publish_native_release.py
