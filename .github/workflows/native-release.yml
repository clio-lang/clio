name: Native release
on:
  push:
    branches: ["native"]
    tags: ["v*"]
    paths:
      - ".github/workflows/native-release.yml"
      - ".github/scripts/**"
      - "CMakeLists.txt"
      - "native/**"
      - "LICENSE"
      - "NOTICE"
  workflow_dispatch:
env:
  HOMEBREW_NO_AUTO_UPDATE: "1"
permissions:
  contents: read
concurrency:
  group: native-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  signing-credentials:
    if: startsWith(github.ref, 'refs/tags/') || vars.KALANDRA_NOTARIZE == 'true'
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate publisher credentials without a release build
        env:
          KALANDRA_SIGNING_P12_BASE64: ${{ secrets.KALANDRA_SIGNING_P12_BASE64 }}
          KALANDRA_SIGNING_P12_PASSWORD: ${{ secrets.KALANDRA_SIGNING_P12_PASSWORD }}
          KALANDRA_APPLE_ID: ${{ secrets.KALANDRA_APPLE_ID }}
          KALANDRA_APPLE_APP_PASSWORD: ${{ secrets.KALANDRA_APPLE_APP_PASSWORD }}
          KALANDRA_APPLE_TEAM_ID: ${{ vars.KALANDRA_APPLE_TEAM_ID }}
          KALANDRA_SIGNING_IDENTITY: ${{ vars.KALANDRA_SIGNING_IDENTITY }}
        run: python3 .github/scripts/notarize_native.py --check-only
      - name: Remove temporary signing credentials
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/kalandra-signing/signing.keychain-db" 2>/dev/null || true
          rm -rf "$RUNNER_TEMP/kalandra-signing"
  build:
    runs-on: macos-15
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate release classifier
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Classify version tag
        id: version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 .github/scripts/release_version.py
      - name: Install native dependencies
        run: |
          brew update
          brew install cmake ninja tomlplusplus zstd z3
          brew upgrade zstd z3
      - name: Install verified pinned LLVM bottle
        run: python3 .github/scripts/provision_native_llvm.py --install --directory "$RUNNER_TEMP/pinned-llvm"
      - name: Configure CPU toolchain
        run: >-
          cmake -S . -B build/native -G Ninja
          -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          -DKALANDRA_LLVM_ROOT="$KALANDRA_LLVM_ROOT"
          -Dtomlplusplus_DIR="$(brew --prefix tomlplusplus)/lib/cmake/tomlplusplus"
          -DKALANDRA_BUILD_METAL_RUNTIME=OFF -DKALANDRA_BUILD_METAL_PROOF=OFF
      - name: Build release packages
        run: >-
          cmake --build build/native --target kalandra native-cpu-package native-editor-tools-package
          native-cpu-standalone-package native-editor-tools-standalone-package -j2
      - name: Qualify installed and relocated packages
        run: >-
          ctest --test-dir build/native
          -R '^native-((cpu|editor-tools)-install|standalone-.*|distribution-archive)$' --output-on-failure
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.12"
      - name: Build and test editor package
        working-directory: native/editor/vscode
        run: |
          bun install --frozen-lockfile
          bun test
          bun run package
      - name: Assemble release assets
        run: |
          mkdir release-assets
          cp build/native/native-cpu/*.tar.gz* release-assets/
          cp build/native/native-editor-tools/*.tar.gz* release-assets/
          cp build/native/native-cpu-standalone/*.tar.gz* release-assets/
          cp build/native/native-editor-tools-standalone/*.tar.gz* release-assets/
          cp build/native/editor/kalandra-native.vsix release-assets/
          cd release-assets
          shasum -a 256 kalandra-native.vsix > kalandra-native.vsix.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: native-release-assets
          path: release-assets/*
          if-no-files-found: error
  qualify-standalone:
    needs: build
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v4
        with:
          name: native-release-assets
          path: release-assets
      # This job intentionally performs no Homebrew/LLVM installation or native build.
      - name: Qualify downloaded standalone editor tools
        run: >-
          python3 native/packaging/StandaloneTests.py --kind editor
          --archive release-assets/kalandra-native-editor-tools-standalone-macos-arm64.tar.gz
      - name: Qualify downloaded standalone CPU compiler
        run: >-
          python3 native/packaging/StandaloneTests.py --kind cpu
          --archive release-assets/kalandra-native-cpu-standalone-macos-arm64.tar.gz
  notarize:
    if: startsWith(github.ref, 'refs/tags/') || vars.KALANDRA_NOTARIZE == 'true'
    needs: [build, qualify-standalone, signing-credentials]
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v4
        with:
          name: native-release-assets
          path: release-assets
      - name: Sign, notarize, staple and assess standalone distributions
        env:
          KALANDRA_SIGNING_P12_BASE64: ${{ secrets.KALANDRA_SIGNING_P12_BASE64 }}
          KALANDRA_SIGNING_P12_PASSWORD: ${{ secrets.KALANDRA_SIGNING_P12_PASSWORD }}
          KALANDRA_APPLE_ID: ${{ secrets.KALANDRA_APPLE_ID }}
          KALANDRA_APPLE_APP_PASSWORD: ${{ secrets.KALANDRA_APPLE_APP_PASSWORD }}
          KALANDRA_APPLE_TEAM_ID: ${{ vars.KALANDRA_APPLE_TEAM_ID }}
          KALANDRA_SIGNING_IDENTITY: ${{ vars.KALANDRA_SIGNING_IDENTITY }}
        run: python3 .github/scripts/notarize_native.py
      - name: Remove temporary signing credentials
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/kalandra-signing/signing.keychain-db" 2>/dev/null || true
          rm -rf "$RUNNER_TEMP/kalandra-signing"
      - uses: actions/upload-artifact@v4
        with:
          name: native-notarized-assets
          path: signed-assets/**/*
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, qualify-standalone, notarize]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: native-release-assets
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          name: native-notarized-assets
          path: signed-assets
      - name: Create draft, upload assets, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          RELEASE_PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: python3 .github/scripts/publish_native_release.py
